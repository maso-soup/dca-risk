name: Update risk data

on:
  schedule:
    - cron: "30 6 * * *"   # daily, after CoinMetrics publishes the prior day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline/build.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/raw
          git diff --cached --quiet || git commit -m "Update risk data $(date -u +%F)"
          git push
